name: release-to-crates-io

on:
  workflow_dispatch:
    inputs:
      tag-to-release:
        type: string
        description: "Tag to release"
        required: true
  workflow_call:
    inputs:
      tag-to-release:
        type: string
        description: "Tag to release"
        required: true

jobs:
  release-to-crates-io:
    runs-on: ubuntu-latest
    steps:
      # Keep release tooling from the workflow revision when retrying an older source tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve publication check
        run: cp _tools/release/is_published.sh "$RUNNER_TEMP/chord-parser-is-published.sh"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag-to-release }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish if not already published
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: |
          crate_name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chord-progression-parser") | .name')"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chord-progression-parser") | .version')"

          published="$(bash "$RUNNER_TEMP/chord-parser-is-published.sh" crates-io "$crate_name" "$crate_version")"
          if [ "$published" = true ]; then
            echo "${crate_name}@${crate_version} is already published; skipping"
            exit 0
          fi

          cargo publish
