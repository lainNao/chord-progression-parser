name: release-to-npm

on:
  workflow_dispatch:
    inputs:
      tag-to-release:
        type: string
        description: "Tag to release"
        required: true
  workflow_call:
    inputs:
      tag-to-release:
        type: string
        description: "Tag to release"
        required: true

concurrency:
  group: release-to-npm-${{ inputs.tag-to-release }}
  cancel-in-progress: false

jobs:
  bundler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag-to-release }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: make environment
        uses: ./.github/actions/make-environment
      - name: build
        run: bun i && make generate-error-code-rs && make build-wasm-bundler
      - name: publish if not already published
        working-directory: pkg/pkg-bundler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(npm pkg get name | tr -d '"')"
          package_version="$(npm pkg get version | tr -d '"')"
          package_spec="${package_name}@${package_version}"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "${package_spec} is already published; skipping"
            exit 0
          fi

          npm publish --access public
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag-to-release }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: make environment
        uses: ./.github/actions/make-environment
      - name: build
        run: bun i && make generate-error-code-rs && make build-wasm-web
      - name: publish if not already published
        working-directory: pkg/pkg-web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(npm pkg get name | tr -d '"')"
          package_version="$(npm pkg get version | tr -d '"')"
          package_spec="${package_name}@${package_version}"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "${package_spec} is already published; skipping"
            exit 0
          fi

          npm publish --access public
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag-to-release }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: make environment
        uses: ./.github/actions/make-environment
      - name: build
        run: bun i && make generate-error-code-rs && make build-wasm-node
      - name: publish if not already published
        working-directory: pkg/pkg-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(npm pkg get name | tr -d '"')"
          package_version="$(npm pkg get version | tr -d '"')"
          package_spec="${package_name}@${package_version}"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "${package_spec} is already published; skipping"
            exit 0
          fi

          npm publish --access public
