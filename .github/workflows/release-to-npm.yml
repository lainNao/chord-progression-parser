name: release-to-npm

on:
  workflow_call:
    inputs:
      tag-to-release:
        type: string
        description: "Tag to release"
        required: true

concurrency:
  group: release-to-npm-${{ inputs.tag-to-release }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        target: [bundler, web, node]
    runs-on: ubuntu-latest
    steps:
      # Keep release tooling from the workflow revision when retrying an older source tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve publication check
        run: cp _tools/release/is_published.sh "$RUNNER_TEMP/chord-parser-is-published.sh"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag-to-release }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: make environment
        uses: ./.github/actions/make-environment
      - name: build
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: bun i && make "build-wasm-${PACKAGE_TARGET}"
      - name: publish if not already published
        working-directory: pkg/pkg-${{ matrix.target }}
        run: |
          package_name="$(npm pkg get name | tr -d '"')"
          package_version="$(npm pkg get version | tr -d '"')"
          package_spec="${package_name}@${package_version}"

          published="$(bash "$RUNNER_TEMP/chord-parser-is-published.sh" npm "$package_name" "$package_version")"
          if [ "$published" = true ]; then
            echo "${package_spec} is already published; skipping"
            exit 0
          fi

          npm publish --access public
