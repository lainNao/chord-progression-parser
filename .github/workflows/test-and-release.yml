name: test-and-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag-to-release:
        type: string
        description: "Existing tag to retry"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    outputs:
      prev-tag: ${{ steps.get-versions.outputs.prev-tag }}
      new-tag: ${{ steps.get-versions.outputs.new-tag }}
      changelog: ${{ steps.prepare-release.outputs.changelog }}
      should-release: ${{ steps.get-versions.outputs.should-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # An unqualified name can select a branch with the same name as the release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag-to-release) || github.sha }}
      - name: Make testing environment
        uses: ./.github/actions/make-environment
      - run: make check-not-broken
      - name: Get prev-tag and new-version
        id: get-versions
        env:
          REQUESTED_TAG: ${{ inputs.tag-to-release }}
        run: |
          git fetch --tags
          new_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chord-progression-parser") | .version')"
          expected_tag="v${new_version}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_TAG" != "$expected_tag" ]; then
              echo "Requested tag $REQUESTED_TAG does not match Cargo version $expected_tag" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${REQUESTED_TAG}" >/dev/null; then
              echo "Requested tag $REQUESTED_TAG does not exist" >&2
              exit 1
            fi
            new_tag="$REQUESTED_TAG"
            should_release=true
          else
            new_tag="$expected_tag"
            if git rev-parse --verify --quiet "refs/tags/${new_tag}" >/dev/null; then
              should_release=false
            else
              should_release=true
            fi
          fi

          prev_tag=""
          while IFS= read -r tag; do
            if [ "$tag" != "$new_tag" ]; then
              prev_tag="$tag"
              break
            fi
          done < <(git tag --sort=-version:refname --merged HEAD)

          printf 'prev-tag=%s\nnew-version=%s\nnew-tag=%s\nshould-release=%s\n' \
            "$prev_tag" "$new_version" "$new_tag" "$should_release" >> "$GITHUB_OUTPUT"
      - name: Echo prev-tag and new-version
        env:
          PREV_TAG: ${{ steps.get-versions.outputs.prev-tag }}
          NEW_VERSION: ${{ steps.get-versions.outputs.new-version }}
          NEW_TAG: ${{ steps.get-versions.outputs.new-tag }}
          SHOULD_RELEASE: ${{ steps.get-versions.outputs.should-release }}
        run: |
          printf 'prev-tag=%s\nnew-version=%s\nnew-tag=%s\nshould-release=%s\n' \
            "$PREV_TAG" "$NEW_VERSION" "$NEW_TAG" "$SHOULD_RELEASE"
      - name: Prepare release
        if: steps.get-versions.outputs.should-release == 'true'
        id: prepare-release
        env:
          NEW_TAG: ${{ steps.get-versions.outputs.new-tag }}
          PREV_TAG: ${{ steps.get-versions.outputs.prev-tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git tag "$NEW_TAG"
            git push origin "refs/tags/$NEW_TAG"
          fi

          {
            echo "changelog<<EOF"
            if [ -n "$PREV_TAG" ] && git merge-base "refs/tags/$PREV_TAG" HEAD >/dev/null; then
              git log "refs/tags/$PREV_TAG"..HEAD --pretty=format:'- %s (%h)'
            else
              git log HEAD --pretty=format:'- %s (%h)'
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Echo output
        env:
          PREV_TAG: ${{ steps.get-versions.outputs.prev-tag }}
          NEW_TAG: ${{ steps.get-versions.outputs.new-tag }}
          CHANGELOG: ${{ steps.prepare-release.outputs.changelog }}
        run: |
          printf 'prev-tag=%s\nnew-tag=%s\nchangelog=%s\n' \
            "$PREV_TAG" "$NEW_TAG" "$CHANGELOG"
  release-to-crates-io:
    needs: [test-and-release]
    uses: ./.github/workflows/release-to-crates-io.yml
    secrets: inherit
    if: needs.test-and-release.outputs.should-release == 'true'
    with:
      tag-to-release: ${{ needs.test-and-release.outputs.new-tag }}
  release-to-npm:
    needs: [test-and-release]
    uses: ./.github/workflows/release-to-npm.yml
    if: needs.test-and-release.outputs.should-release == 'true'
    with:
      tag-to-release: ${{ needs.test-and-release.outputs.new-tag }}
  release-to-github:
    # Announce a release only after every package publication has succeeded.
    needs: [test-and-release, release-to-crates-io, release-to-npm]
    uses: ./.github/workflows/release-to-github.yml
    secrets: inherit
    if: needs.test-and-release.outputs.should-release == 'true'
    with:
      tag-to-release: ${{ needs.test-and-release.outputs.new-tag }}
      changelog: ${{ needs.test-and-release.outputs.changelog }}
